name: CI
on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: index.json is up to date (otherwise run `npm run index` and commit)
        run: npm run index && git diff --exit-code index.json
      - name: Templates match the panel's schema (template.schema.json on harrier-gg/backend main)
        run: npm run validate
