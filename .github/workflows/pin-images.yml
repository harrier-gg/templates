name: Pin images
# Weekly: pins every image to the digest its tag points to now and opens (or updates) one PR, so
# image updates arrive like Dependabot's, reviewed and in a commit.
on:
  schedule:
    - cron: "0 6 * * 1" # Mondays 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency: pin-images

jobs:
  pin:
    runs-on: ubuntu-latest
    env:
      BRANCH: bot/pin-images
    steps:
      # PRs opened with the default GITHUB_TOKEN do not trigger other workflows, so the required
      # checks would never run on them. With the Harrier release bot (org variable
      # RELEASE_APP_CLIENT_ID + org secret RELEASE_APP_PRIVATE_KEY) they run normally.
      - id: app-token
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          token: ${{ steps.app-token.outputs.token || github.token }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Pin and rebuild index.json
        id: pin
        run: |
          npm run --silent pin | tee "$RUNNER_TEMP/pinned.txt"
          npm run --silent index
          if git diff --quiet; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi
      - name: Open or update the PR
        if: steps.pin.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token || github.token }}
        run: |
          npm run validate
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -C "$BRANCH"
          git commit -qam "chore(deps): pin new image digests"
          # The bot owns this branch: each run replaces last week's update with the current one.
          git push --force origin "$BRANCH"
          {
            printf '## Type\n\n- [ ] Feature\n- [ ] Bug fix\n- [ ] Docs\n- [x] Refactor / chore / CI\n\n'
            printf '## Summary\n\nImage tags moved since the last pin. New digests (`npm run pin`):\n\n```\n'
            cat "$RUNNER_TEMP/pinned.txt"
            printf '```\n\n## Related issue\n\nNone (scheduled image update).\n\n'
            printf '## How was this tested?\n\n`npm run validate` passed in the workflow; CI runs the full check on this PR. Try a changed game on a test node before merging when the image changed a lot.\n\n'
            printf '## Checklist\n\n- [ ] `just check` passes locally\n- [ ] Tests added or updated (bug fixes: a test that fails without the fix)\n- [x] User-facing text exists in **English and German** (English is the source; see CONTRIBUTING.md)\n- [x] Docs updated if behaviour changed\n- [x] Contract changes (API, agent protocol, template schema) follow the order in CONTRIBUTING.md\n'
          } > "$RUNNER_TEMP/body.md"
          if [ -z "$(gh pr list --head "$BRANCH" --state open --json number -q '.[].number')" ]; then
            gh pr create --base main --head "$BRANCH" --title "chore(deps): pin new image digests" --body-file "$RUNNER_TEMP/body.md"
          else
            gh pr edit "$BRANCH" --body-file "$RUNNER_TEMP/body.md"
          fi
