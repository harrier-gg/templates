schemaVersion: 1
id: minecraft-java/fabric
extends: minecraft-java
variant:
  id: fabric
  name: Fabric
  description: { en: Lightweight mod loader for Fabric mods., de: Leichtgewichtiger Mod-Loader für Fabric-Mods. }
runtime:
  env:
    TYPE: FABRIC
versions:
  provider: fabric
# Mods and where to find them (ADR 0017); more sources are more list entries.
content:
  - kind: mod
    label: { en: Mods, de: Mods }
    path: mods
    sources:
      - { provider: modrinth, type: mod, loader: fabric }
# Friends download the client mods as one pack their launcher imports (ADR 0018).
share: { format: mrpack, loader: fabric-loader }
